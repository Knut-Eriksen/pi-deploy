# Shared deploy for all projects on the Pi. Each repo calls this from its own deploy.yml.
# Contract: the project is cloned at ~/<dir> on the Pi (dir = repo name as on GitHub), has a compose file, and keeps .env/data untracked there.
name: pi-deploy
on:
  workflow_call:
    inputs:
      dir:
        type: string
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64]
    concurrency: pi-deploy-${{ inputs.dir }}
    steps:
      - env:
          DIR: ${{ inputs.dir }}
          REPO: ${{ github.repository }}
        run: |
          cd "$HOME/$DIR"
          git remote set-url origin "https://github.com/$REPO.git"   # ponytail: https, port 22 is blocked from the Pi; auth via gh auth setup-git
          git fetch origin production
          git checkout -B production origin/production   # fails loudly if someone edited tracked files on the Pi
          docker compose up -d --build
          docker image prune -f
